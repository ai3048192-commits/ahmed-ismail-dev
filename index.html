<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ahmed Ismail Shabana — Frontend developer building fast, maintainable web interfaces with React, Next.js, TypeScript and Supabase." />
    <meta name="theme-color" content="#0d0d0f" />
    <title>Ahmed Ismail — Frontend Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- same URL the app builds from the default settings (src/lib/settings.ts → fontsHref), so it is fetched once -->
    <link
      id="site-fonts"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // apply the saved theme/language before React paints, so there is no flash
      try {
        var t = localStorage.getItem("theme");
        if (t === "light") document.documentElement.classList.remove("dark");
        var l = localStorage.getItem("lang");
        if (l === "AR") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
